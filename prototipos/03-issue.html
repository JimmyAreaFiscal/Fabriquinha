<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Issue · protótipo</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="base.css">
  <style>
    h3 { font-size: var(--fs-md); }
    .migalha { font-size: var(--fs-sm); color: var(--muted); margin-bottom: var(--s-2); }
    .migalha a:hover { color: var(--ink); }
    .titulo-issue { font-size: var(--fs-2xl); line-height: 1.25; }
    .titulo-issue .id { font-size: var(--fs-xl); margin-right: var(--s-2); vertical-align: 2px; }
    .pr { font-family: var(--mono); color: var(--accent); }
    .link { color: var(--accent); font-size: var(--fs-sm); background: none; border: 0; padding: 0; font-family: inherit; cursor: pointer; }
    .link:hover { text-decoration: underline; }
    .dep { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 2px 0 var(--s-2); font: var(--fs-xs) var(--mono); background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r-md); }
    .x { display: inline-flex; padding: 1px 4px; color: var(--muted); background: none; border: 0; border-radius: var(--r-sm); cursor: pointer; }
    .x:hover { color: var(--ink); background: var(--line); }

    /* Trilho de fases */
    .trilho-fases { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); margin: var(--s-4) 0 0; max-width: 980px; }
    .passo { display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .passo .linha { position: relative; width: 100%; height: 18px; display: flex; align-items: center; justify-content: center; }
    .passo .linha::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 2px; background: var(--line); }
    .passo:first-child .linha::before { left: 50%; }
    .passo:last-child .linha::before { right: 50%; }
    .passo.feito .linha::before { background: var(--closed); }
    .passo.atual .linha::before { background: linear-gradient(to right, var(--closed) 50%, var(--line) 50%); }
    .marco { position: relative; width: 12px; height: 12px; border-radius: 50%; background: var(--bg); border: 2px solid var(--line); }
    .gate .marco { border-radius: 2px; transform: rotate(45deg); width: 11px; height: 11px; }
    .feito .marco { background: var(--closed); border-color: var(--closed); }
    .atual .marco { width: 16px; height: 16px; background: var(--open); border-color: var(--open); box-shadow: 0 0 0 4px rgb(234 178 76 / 0.22); }
    .atual.gate .marco { width: 14px; height: 14px; }
    .passo > span { font-size: var(--fs-xs); color: var(--muted); text-align: center; line-height: 1.25; }
    .passo.atual > span { color: var(--open); font-weight: var(--w-strong); }

    /* Mesa: lateral + principal */
    .mesa { display: grid; grid-template-columns: 340px minmax(0, 1fr); gap: var(--s-6); align-items: start; margin-top: var(--s-5); }
    .lateral { position: sticky; top: 64px; max-height: calc(100vh - 80px); overflow: auto; display: flex; flex-direction: column; gap: var(--s-3); }
    .cartao-lateral { padding: var(--s-3) var(--s-4); }
    .cartao-lateral h3, .titulo-bloco { margin-bottom: var(--s-2); font-size: var(--fs-xs); font-weight: var(--w-strong); color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
    .fatos { display: grid; grid-template-columns: max-content 1fr; gap: 6px var(--s-3); margin: 0; font-size: var(--fs-sm); }
    .fatos dt { color: var(--muted); }
    .fatos dd { margin: 0; display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
    .descricao { max-height: 180px; overflow: hidden; position: relative; }
    .descricao.aberta { max-height: none; }
    .descricao:not(.aberta)::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 48px; background: linear-gradient(transparent, var(--surface)); }

    .linha-tempo { list-style: none; margin: 0; padding: 0; }
    .linha-tempo li { position: relative; padding: 0 0 var(--s-3) var(--s-5); font-size: var(--fs-sm); }
    .linha-tempo li::before { content: ""; position: absolute; left: 4px; top: 10px; bottom: -2px; width: 2px; background: var(--line); }
    .linha-tempo li:last-child { padding-bottom: 0; }
    .linha-tempo li:last-child::before { display: none; }
    .linha-tempo li::after { content: ""; position: absolute; left: 0; top: 5px; width: 10px; height: 10px; border-radius: 50%; background: var(--muted); }
    .linha-tempo li.concluido::after { background: var(--closed); }
    .linha-tempo li.em_execucao::after { background: var(--claimed); }
    .linha-tempo li.aberto::after { background: var(--bg); border: 2px solid var(--muted); width: 6px; height: 6px; }
    .linha-tempo li.falhou::after { background: var(--danger); }
    .ticket-btn { all: unset; display: flex; gap: var(--s-2); align-items: baseline; width: 100%; cursor: pointer; }
    .ticket-btn:hover .tt { text-decoration: underline; text-decoration-color: var(--muted); }
    .ticket-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .linha-tempo .sub { display: flex; flex-wrap: wrap; gap: 4px var(--s-2); align-items: center; margin-top: 3px; font-size: var(--fs-xs); color: var(--muted); }
    .st-aberto { color: var(--muted); background: var(--surface-2); }
    .st-em_execucao { color: var(--claimed); background: var(--claimed-bg); }
    .st-concluido { color: var(--closed); background: var(--closed-bg); }
    .st-falhou { color: var(--danger); background: var(--danger-bg); }
    .chat { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
    .chat .ir { color: var(--accent); }

    /* Gate */
    .gate-painel { background: var(--surface); border: 1px solid #5a4720; border-top: 3px solid var(--open); border-radius: var(--r-lg); }
    .gate-cabeca { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s-2) var(--s-3); padding: var(--s-3) var(--s-4); border-bottom: 1px solid var(--line); }
    .gate-cabeca .rotulo { color: var(--open); font-size: var(--fs-sm); }
    .gate-cabeca .direita { margin-left: auto; }
    .gate-corpo { padding: var(--s-4); display: flex; flex-direction: column; gap: var(--s-5); }
    .numeros { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: var(--s-2); }
    .numero { padding: var(--s-2) var(--s-3); background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r-md); }
    .numero strong { display: block; font-size: var(--fs-xl); line-height: 1.3; font-variant-numeric: tabular-nums; }
    .numero > span { font-size: var(--fs-sm); color: var(--muted); }
    .impacto-baixo { color: var(--closed); }
    .duas { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: var(--s-4); align-items: start; }
    .duas .numeros { grid-template-columns: 1fr 1fr; }
    .video { position: relative; aspect-ratio: 16 / 9; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle at 30% 20%, #2b2721, #0d0c0b); border: 1px solid var(--line); border-radius: var(--r-md); color: var(--muted); }
    .video .play { width: 52px; height: 52px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: rgb(237 231 219 / 0.12); border: 1px solid rgb(237 231 219 / 0.3); color: var(--ink); font-size: 18px; padding-left: 4px; }
    .video .legenda { position: absolute; left: var(--s-3); bottom: var(--s-2); font: var(--fs-xs) var(--mono); }
    .corpo-pr { max-height: 280px; overflow: auto; padding: var(--s-3) var(--s-4); background: var(--bg); border: 1px solid var(--line); border-radius: var(--r-md); }
    .propostos .seletor-modelo { width: 250px; }
    .seletor-modelo, textarea { font: inherit; font-size: var(--fs-sm); color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: var(--r-md); padding: 4px var(--s-2); }
    .seletor-modelo { font: var(--fs-xs) var(--mono); height: 26px; }
    .seletor-modelo.override { color: var(--accent); border-color: #5a4720; }
    textarea { width: 100%; resize: vertical; min-height: 56px; line-height: 1.5; }
    .seletor-modelo:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: transparent; }
    .decidir { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--s-2) var(--s-4); align-items: end; padding: var(--s-3) var(--s-4); background: #191714; border-top: 1px solid var(--line); border-radius: 0 0 var(--r-lg) var(--r-lg); }
    .decidir label { display: flex; flex-direction: column; gap: var(--s-1); font-size: var(--fs-sm); color: var(--muted); }
    .decidir .botoes { display: flex; gap: var(--s-2); }
    .btn-reprovar { color: var(--danger); border-color: var(--danger-bg); background: transparent; }
    .btn-reprovar:hover:enabled { background: var(--danger-bg); }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-grande { height: 34px; padding: 0 var(--s-4); font-size: var(--fs-md); }
    .manual { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s-2) var(--s-4); padding: var(--s-3) var(--s-4); background: #191714; border-top: 1px solid var(--line); border-radius: 0 0 var(--r-lg) var(--r-lg); font-size: var(--fs-sm); color: var(--muted); }
    .manual .btn { margin-left: auto; }

    /* Tabelas */
    .tabela { width: 100%; border-collapse: collapse; font-size: var(--fs-sm); }
    .tabela th { text-align: left; font-size: var(--fs-xs); font-weight: var(--w-strong); color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; padding: 6px var(--s-2); border-bottom: 1px solid var(--line); white-space: nowrap; }
    .tabela td { padding: 7px var(--s-2); border-bottom: 1px solid var(--line); vertical-align: middle; }
    .tabela tr:last-child td { border-bottom: 0; }
    .tabela .mono { font-family: var(--mono); font-size: var(--fs-xs); white-space: nowrap; }
    .tabela .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .tabela .acoes-t { text-align: right; white-space: nowrap; }
    .tabela .d { color: var(--muted); font-size: var(--fs-xs); }
    .ok { color: var(--closed); } .nok { color: var(--danger); }
    .bigo { font-family: var(--mono); font-size: var(--fs-xs); white-space: nowrap; }
    .nao-previsto { color: var(--open); font-weight: var(--w-strong); }

    /* Artefatos: cards que abrem a caixa */
    .secao { margin-top: var(--s-6); }
    .secao > h2 { display: flex; align-items: baseline; gap: var(--s-2); margin-bottom: var(--s-3); }
    .secao > h2 .muted { font-size: var(--fs-sm); font-weight: 400; }
    .etapa-artefatos { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: var(--s-3); padding: var(--s-2) 0; border-top: 1px solid var(--line); }
    .etapa-artefatos:first-of-type { border-top: 0; }
    .etapa-nome { font-size: var(--fs-sm); padding-top: 6px; }
    .etapa-nome .id { display: block; }
    .cards-art { display: flex; flex-wrap: wrap; gap: var(--s-2); }
    .art { all: unset; box-sizing: border-box; display: flex; align-items: center; gap: var(--s-2); height: 36px; padding: 0 var(--s-3); font-size: var(--fs-sm); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); cursor: pointer; }
    .art:hover { border-color: var(--accent); }
    .art:focus-visible { outline: 2px solid var(--accent); }
    .art .tipo { font: 600 10px var(--mono); color: var(--muted); border: 1px solid var(--line); border-radius: 2px; padding: 1px 4px; letter-spacing: 0.04em; }
    .art .ponto { width: 7px; height: 7px; border-radius: 50%; background: var(--closed); }
    .art .ponto.nok { background: var(--danger); }

    /* Caixa (dialog) */
    .caixa { width: min(1100px, 94vw); height: min(820px, 88vh); padding: 0; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: 0 24px 64px rgb(0 0 0 / 0.65); }
    .caixa[open] { display: flex; flex-direction: column; }
    .caixa::backdrop { background: rgb(0 0 0 / 0.6); }
    .caixa-cabeca { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s-2) var(--s-3); padding: var(--s-3) var(--s-4); border-bottom: 1px solid var(--line); }
    .caixa-cabeca h2 { font-size: var(--fs-lg); }
    .caixa-cabeca .direita { margin-left: auto; display: flex; gap: var(--s-3); align-items: center; }
    .btn-icone { width: 28px; padding: 0; justify-content: center; }
    .caixa-corpo { flex: 1; min-height: 0; overflow: auto; padding: var(--s-4); }
    .caixa-corpo iframe { display: block; width: 100%; height: 100%; min-height: 560px; border: 0; background: #fff; border-radius: var(--r-md); }
    .caixa-corpo img { display: block; max-width: 100%; margin: 0 auto; border: 1px solid var(--line); border-radius: var(--r-md); }
    .caixa-corpo pre { margin: 0; padding: var(--s-3); font: var(--fs-sm) / 1.55 var(--mono); background: var(--bg); border: 1px solid var(--line); border-radius: var(--r-md); white-space: pre-wrap; }
    .caixa-corpo .video { max-width: 900px; margin: 0 auto; }

    .md { line-height: 1.6; font-size: var(--fs-sm); }
    .md > :first-child { margin-top: 0; } .md > :last-child { margin-bottom: 0; }
    .md p, .md ul, .md ol, .md table { margin: 0 0 var(--s-2); }
    .md h2, .md h3, .md h4 { margin: var(--s-3) 0 var(--s-1); font-size: var(--fs-sm); }
    .md ul, .md ol { padding-left: var(--s-5); }
    .md code { font: 0.9em var(--mono); padding: 1px 4px; background: var(--surface-2); border-radius: var(--r-sm); }
    .md table { border-collapse: collapse; }
    .md th, .md td { padding: 3px var(--s-2); border: 1px solid var(--line); text-align: left; }

    .trocador .trocador-botoes a { font-weight: 400; font-size: var(--fs-xs); }

    @media (max-width: 1100px) {
      .mesa { grid-template-columns: minmax(0, 1fr); }
      .lateral { position: static; max-height: none; }
      .duas { grid-template-columns: minmax(0, 1fr); }
      .rola { overflow-x: auto; }
    }
    @media (max-width: 700px) {
      .passo:not(.atual) > span { visibility: hidden; }
      .passo.atual > span { white-space: nowrap; }
      .etapa-artefatos { grid-template-columns: minmax(0, 1fr); gap: var(--s-1); }
      .decidir { grid-template-columns: minmax(0, 1fr); }
      .propostos .seletor-modelo { width: 150px; }
    }
  </style>
</head>
<body>
  <header class="nav">
    <span class="marca">Fabriquinha</span>
    <nav aria-label="Páginas">
      <a href="01-inicio.html">Início <span class="contador" title="sessões que aguardam você">6</span></a>
      <a href="02-projeto.html" aria-current="page">Projetos</a>

    </nav>
  </header>

  <main class="pagina" data-pagina></main>

  <dialog class="caixa" data-caixa aria-labelledby="caixa-titulo">
    <div class="caixa-cabeca"><h2 id="caixa-titulo" data-caixa-titulo></h2><span data-caixa-meta class="muted"></span>
      <div class="direita"><a class="link" href="#" data-caixa-aba hidden>abrir em nova aba ↗</a><a class="link" href="#" data-caixa-baixar hidden>baixar</a><button class="btn btn-icone" data-fechar title="Fechar (Esc)" autofocus>✕</button></div>
    </div>
    <div class="caixa-corpo" data-caixa-corpo></div>
  </dialog>

  <aside class="trocador" aria-label="Exemplos do protótipo">
    <button class="trocador-fechar" title="Recolher">–</button>
    <span class="rotulo">Issue · C enxuta · exemplo</span>
    <div class="trocador-botoes">
      <a href="?ex=desenho" data-ex="desenho">I-37 · gate do desenho</a><a href="?ex=pr" data-ex="pr">I-29 · gate do PR</a>
    </div>
    <p>Na página ficam só vídeo, cards, tabelas, a descrição e o corpo do PR. Cada artefato abre numa caixa; cada ticket abre as suas execuções.</p>
  </aside>

  <script>
    const FASES = [
      ["registro", "Registro"], ["desenho", "Desenho"], ["aprovacao_desenho", "Aprovação do desenho"],
      ["desenvolvimento", "Desenvolvimento"], ["revisao", "Revisão"], ["encerramento", "Encerramento"],
      ["aprovacao_pr", "Aprovação do PR"], ["ajuste_pr", "Ajuste do PR"],
    ];
    const GATES = new Set(["aprovacao_desenho", "aprovacao_pr"]);
    const STATUS = { aberto: "aberto", em_execucao: "em execução", concluido: "concluído", falhou: "falhou" };
    const OPUS = "anthropic / claude-opus-5-5", QWEN = "llamacpp / qwen3-coder-30b";
    const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
    const doc = (titulo, corpo) => `<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><style>body{font:15px/1.6 system-ui,sans-serif;margin:24px;color:#1d1d1f;background:#fff;max-width:860px}h1{font-size:20px;margin:0 0 12px}h2{font-size:16px;margin:20px 0 6px}code{background:#f0f0f0;padding:1px 4px;border-radius:3px}.fluxo{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:12px 0}.fluxo div{border:1px solid #888;border-radius:6px;padding:6px 10px;background:#f7f7f7}</style></head><body><h1>${titulo}</h1>${corpo}</body></html>`;
    const wire = `data:image/svg+xml,${encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="960" height="450" viewBox="0 0 640 300"><rect width="640" height="300" fill="#141311"/><rect width="640" height="28" fill="#1c1a17"/><rect x="16" y="9" width="70" height="10" rx="2" fill="#e5ad6f"/>${[0,1,2,3,4,5,6,7].map(n=>`<rect x="${16+n*77}" y="60" width="70" height="${[180,140,120,200,90,90,110,90][n]}" rx="4" fill="#1c1a17" stroke="#37332c"/><rect x="${22+n*77}" y="70" width="58" height="36" rx="3" fill="#25231f"/>${n%3===0?`<rect x="${22+n*77}" y="112" width="58" height="36" rx="3" fill="#25231f" stroke="#eab24c"/>`:""}`).join("")}</svg>`)}`;

    // ——— tabelas usadas na página e na caixa ———
    const tCriterios = (c) => `<div class="rola"><table class="tabela"><thead><tr><th>ID</th><th>Dado</th><th>Quando</th><th>Então</th></tr></thead><tbody>${c.map(([id, d, q, e]) => `<tr><td class="mono">${id}</td><td>${esc(d)}</td><td>${esc(q)}</td><td>${esc(e)}</td></tr>`).join("")}</tbody></table></div>`;
    const tComprovacao = (c) => `<div class="rola"><table class="tabela"><thead><tr><th>ID</th><th>Atendido</th><th>Como foi verificado</th><th class="num">Anexos</th></tr></thead><tbody>${c.map(([id, ok, como, n]) => `<tr><td class="mono">${id}</td><td class="${ok ? "ok" : "nok"}">${ok ? "✓ sim" : "✗ não"}</td><td>${esc(como)}</td><td class="num"><button class="link">${n} ${n > 1 ? "prints" : "print"}</button></td></tr>`).join("")}</tbody></table></div>`;
    const tFitness = (f) => `<div class="rola"><table class="tabela"><thead><tr><th>Fitness function</th><th>Resultado</th><th class="num">Duração</th><th>Explicação do agente</th></tr></thead><tbody>${f.map(([n, ok, d, e]) => `<tr><td class="mono">${n}</td><td class="${ok ? "ok" : "nok"}">${ok ? "✓ passou" : "✗ falhou"}</td><td class="num">${d}</td><td>${esc(e)}</td></tr>`).join("")}</tbody></table></div>`;
    const tComplexidade = `<div class="rola"><table class="tabela"><thead><tr><th>Fluxo</th><th>Situação</th><th>Antes (tempo · espaço)</th><th>Depois (tempo · espaço)</th></tr></thead><tbody>
      <tr><td>Montar o board</td><td>novo</td><td class="bigo muted">—</td><td class="bigo">O(i + t) · O(i + t)</td></tr>
      <tr><td>Listar sessões ativas</td><td>alterado</td><td class="bigo">O(s log s) · O(s)</td><td class="bigo">O(s log s) · O(s)</td></tr></tbody></table></div>`;
    const tArquivos = `<div class="rola"><table class="tabela"><thead><tr><th>Arquivo</th><th>Status</th><th class="num">+/−</th><th>Previsto no desenho</th></tr></thead><tbody>
      <tr><td class="mono">src/rotas/webhook-pix.ts</td><td>A</td><td class="num"><span class="ok">+142</span> <span class="nok">−0</span></td><td class="mono">src/rotas/webhook-*.ts</td></tr>
      <tr><td class="mono">src/pagamento/conciliar.ts</td><td>A</td><td class="num"><span class="ok">+88</span> <span class="nok">−0</span></td><td class="mono">src/pagamento/*.ts</td></tr>

      if (tk) { abrirTicket(tk.dataset.ticket); return; }
      if (e.target.closest("[data-fechar]") || e.target === caixa) { caixa.close(); return; }
      if (e.target.closest("[data-ver-descricao]")) { const d = document.querySelector("[data-descricao]"); d.classList.toggle("aberta"); e.target.textContent = d.classList.contains("aberta") ? "ver menos" : "ver tudo"; return; }
      const exb = e.target.closest("[data-ex]");
      if (exb) { e.preventDefault(); ex = exb.dataset.ex; history.replaceState(null, "", `?ex=${ex}`); render(); scrollTo(0, 0); }
    });
    document.addEventListener("input", (e) => { if (e.target.matches("[data-motivo]")) document.querySelector("[data-reprovar]").disabled = !e.target.value.trim(); });
    document.addEventListener("change", (e) => { if (e.target.matches(".seletor-modelo")) e.target.classList.toggle("override", e.target.value !== ""); });
    const trocador = document.querySelector(".trocador");
    trocador.querySelector(".trocador-fechar").onclick = () => trocador.classList.toggle("min");
    render();
    const aberta = location.hash.match(/^#caixa=(\d+):(\d+)$/);
    if (aberta) abrirArtefato(+aberta[1], +aberta[2]);
  </script>
</body>
</html>
